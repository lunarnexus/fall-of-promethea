[tips-and-tricks-item-description]
fall-of-promethea=A long, long time ago, in a solar system far, far away, a great federation of 4 great races thrived in peace for untold eons.  Times of comfort and\n prosperity brought great advancements in science, arts, music, and philosophy… but also complacency. Using advanced materials like Promethium, the greatest of the\n federation—the Prometheans— masters of logistics, manufacturing, and efficiency, reached far beyond their homeworld, constructing wonders that defied imagination.\n\nAll that remains now are fragments of their shattered world, scattered across the void. The Engineer, whose purpose and origins remain a mystery, seeks to rebuild their crashed\n space vessle and try to return home. Having built vast factories for rockets and space vessels, the Engineer explores beyond the local solar system ... and finds Promethium.\n\n"...Promethea became the pinnacle of civilization, a beacon of knowledge and technological mastery. Yet now, only shattered remnants remain—silent monuments to ambition\n and hubris? What fate befell them?"

promethium-radiation=Promethium is unlike any material you've encountered. If left unchecked, it oxidizes and spoils. Some forms decay into inert waste, while others give\n off harmful radiation ... and sometimes explode.  There is power in Promethium, but there is also risk. It can be mitigated, and sometimes contained.  You will need to use\n a variety of strategies to mitigate the risk.  You are HIGHLY encouraged to experiement with each form of Promethium, and study the Factoriopedia entries.\n  [technology=promethium-processing] research indicates Promethium was the base for most Promethean technology towards the end of their civilzation.  If you are prudent ...\n and lucky ... you just may avoid the same fate as the ancient Prometheans.\n\n" ... At the heart of their advanced technology was Promethium—a substance unlike any other, brimming with raw, untapped potential. It offered nearly limitless energy\n ... but also possessed unparalleled destructive potential ..."

unstable-dangers=[technology=isotope-processing]research has found some semi-safe ways of handling unstable isotopes. While powerful, these isotopes carry significant risks—instability, radiation, and explosive potential.

removed="...Promethea was once a beacon of peace and prosperity, its people driven by exploration, not conquest. But fear is a powerful tool.  One political leader used it to\n reshape their future. He warned of foreign invaders, of enemies eroding their strength, of corruption that only he could purge. Promethea did not fall to war—it fell to control.  Democracy was not abolished; it was hollowed out. Laws changed to create a wealth divide, elections became theater, dissent labeled as treason. The people, promised strength and security, found themselves ruled by an elite who knew only greed and a lust for power. Promethium, the energy source that fueled their empire, mirrored their decline—unstable, volatile, corrosive ..." 

promethean-space-travel=[technology=promethium-space-travel] research opens the doors to advanced propulsion.  It is said, thrusters enhanced with promethium gave the Promethean Ascendancy ships\n an incredible speed and distance advantage.\n\n"...The Ascendancy turned outward, reshaping worlds in their image, crushing dissent. Their fleets expanded, their influence stretched across the stars, and their leader\n was heralded as the savior that made Promethea great again. But the foundations of their empire were as brittle as the lies that built them. Their reach exceeded their\n grasp, their promises unraveled, and their power, once absolute, collapsed by an unlikely alliance. ..."

promethium-energy=[technology=promethium-power-handling] research unlocks potent Promethium energy applications. Manage carefully: improper handling risks radiation leaks and explosive\n failures.\n\n"... Driven by ambition, conservative elites manipulated the populace through fearmongering, spreading rumors of unseen enemies and rival civilizations poised to strike.\n Security, they claimed, required absolute power and obedience. Democracy eventually collapsed, replaced by a single authoritarian ruling body—the Promethean Ascendancy.\n Dissenters were silenced, elections became theatre, and corporate interests dominated law, ruling with iron resolve.  Once in power, they used Promethium,\n the substance once heralded as the key to unlimited free energy and efficiency, into great weapons ..."

promethean-warfare=[technology=promethium-weapons-tech] has given you access to powerful but dangerous weaponry. Harnessing Promethium in warfare greatly amplifies destructive capabilities, but also magnifies inherent dangers.\n\n" ... Thus began the Ascendancy Wars— Planets were reduced to wastelands, civilian casualties dismissed as collateral damage. The people, disarmed and powerless, could only watch as worlds burned. Prometheans—even those who opposed the Ascendancy—became vilified, feared, and hated across the galaxy.  Though The Ascendancy conquered some worlds quickly, but an alliance of the 4 great races of the galaxy formed a resistance.  A great alliance of the remnants of shattered civilizations and broken worlds still willing to fight injustice, banded together, led by Promethean rebels.

promethium-rockets=Through [technology=promethium-rocket-tech], and studying ancient debris, you've unlocked the secrets to Promethean rocket technologies, once pivotal to the resistance's military strategy.

removed2=\n\n\n"... The Aegis was formed, a resistance to fight back against the tyranny of the Ascendancy. Biters, Pentapods and rebel Prometheans designed a explosive weapon enhanced with Promethium.  And for a time, the tides of the war shifted.  To counter this threat, The Ascendancy began construction of **an ultimate weapon**, an unimaginable tool of conquest designed to permanently solidify their rule. Once complete, resistance would become impossible ..."

the-oath=Behold the [technology=ion-cannon], a scaled down version of the ultimate weapon, central to the Promethean Ascendancy’s final chapter. This powerful weapon marks a critical moment in galactic history, and the end of an era.

removed3=\n\n" ... A new devastating weapon, the Promethium Ion Cannon was unleashed, traveling fom system to system crushing all who opposed the Ascendency.  Aegis fleets fell like never before.  The might of this new weapon couldn't be matched, and for good reason.  The weapon, though incredibly destructive, was also incredibly dangerous to wield and construct.  In their desperation, the Aegis took advantage of this instability.  The remaining few Promethean rebels infiltrated their once home planet, and sabataged the factory where the Icon Cannon was made.\n\nThe resulting explosion was nothing short of cataclysmic.  The Promethean solar system was devistated, and their once peaceful planets shattered.  Nothing remains but wreckage, debris and shattered pieces of Promethium floating endlessly.  The Promethean rebels sacrificed the survival of their civilization to ensure peace for all others in the galaxy.\n\n With The Ascendency defeated, the Aegis swore an oath.  No civilization would ever be allowed to reach this level of technology again.  Use of Promethium was forbidden.  The ways of nature and balance with the universe would be embraced as the chosen path forward.  Polluting technologies were abandoned, and research focus shifted to Gaia technologies and practices, harmony over ambition.  Bound to this Oath, the Aegis waits and watches ... "

