[item-description]
promethium-gravel=Crushed fragments of a long-dead world, still laced with untapped energy.  It oxidizes over time.
promethium-ore=Refined from ancient debris of the past—both powerful and volatile.  Oxidation is still an issue.
promethium-plate=Smelted Promethium, once the key to an empire’s rise… and fall.  Emits low levels of harmful radiation.  Scaling production will be tricky.
unstable-isotope=A dangerous unstable promethium isotope that emits radiation and decays quickly.  Can power a nuclear reactor, if you're brave enough.
stable-isotope=A stable form of promethium. Safe to store and makes a great fuel.
promethium-wall=The crystaline structure of Promethium makes these walls radiation resistant, and near impervious to impacts.  
promethium-thruster=Using a high energy magnetic containment grid, these thrusters are powerful and efficient. Don't let the containment grid fail, you've been warned.
promethium-accumulator=An advanced accumulator enhanced with a Promethium grid. Stores a little more energy, but charge/discharge rates are akin to a capacitor.
promethium-bcr-panel=A panel that captures background cosmic radiation.  Produces steady power, unaffected by day/night cycles.  Considering its made from Promethium, its suprisingly safe and simple.
promethium-bullet-magazine=Someone got the bright idea to create an explosive promethium coated bullet.  The bullet doesn't do a ton of damage, but the radioactive explosion spreads the love nicely.  Wear your safety glasses.
promethium-grenade=From what you can gather, the Prometheans destroyed their own planet.  Probably from bad ideas like this thing.    
plasma-projector=Add a Promethium field inductor, dramatically amp up the juice, and you've radioactive plasma.  Shockingly large range.
promethium-rocket=Larger AoE, lingering radiation effects.  Highly effective against asteroids and devastating to organic targets.
ion-cannon=Your research suggests this devistating device was the staple long-range ship-to-ship weapon on Promethean war ships.  Your version seems less sophisticaed than the original, but effective regardless.  Make sure the containment grid stays powered. 
ion-cannon-ammo=The Singularity Matrix seems to rip tiny holes in space-time causing vast amounts of damage from ionized radiation.

